[project]
name = "margin"
version = "0.1.0"
description = "Search, review, and precisely edit fictional contracts."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=3.19.2",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
